plugins { id 'com.android.library' }

def sdkRoot = providers.gradleProperty('discordSdkRoot')
    .orElse(layout.projectDirectory.dir('../third_party/discord_social_sdk').asFile.absolutePath)
    .get()

android {
    namespace 'dev.countergd.discordsocialbridge'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -fexceptions -frtti'
                arguments "-DDISCORD_SDK_ROOT=${sdkRoot}",
                          "-DDISCORD_SDK_LIBRARY=${providers.gradleProperty('DISCORD_SDK_LIBRARY').orElse('').get()}"
            }
        }
    }
    externalNativeBuild {
        cmake { path file('../native/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
