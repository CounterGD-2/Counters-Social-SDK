name: Android bridge build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android AAR (stub unless SDK package is provided)
        run: gradle :bridge:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: discord-social-sdk-android-bridge-debug
          path: bridge/build/outputs/aar/*.aar
